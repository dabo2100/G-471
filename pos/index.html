<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .modalBody {
        width: 100%;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.516);
        justify-content: center;
        align-items: center;
        position: fixed;
        z-index: 10;
        top: 0;
        display: none;
      }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.css" integrity="sha512-phGxLIsvHFArdI7IyLjv14dchvbVkEDaH95efvAae/y2exeWBQCQDpNFbOTdV1p4/pIa/XtbuDCnfhDEIXhvGQ==" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body>
    <section class="col-12">
      <div class="container py-4 d-flex flex-column gap-3">
        <h1 class="alert alert-info text-center">Your Products</h1>
        <div class="d-flex">
          <button onclick="openModal()" class="btn btn-success">Add New Product</button>
        </div>
        <table class="table table-dark">
          <thead>
            <tr>
              <th>#</th>
              <th>Produt Name</th>
              <th>Produt Price</th>
              <th>Produt Qty</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="modalBody" id="newPhoneModal">
        <div class="animate__animated animate__fadeInUp bg-white p-4 rounded-3 shadow border d-flex flex-column gap-3">
          <h1>Add New Phone</h1>
          <input id="phoneNameInput" class="form-control" type="text" placeholder="Enter Phone Name" />
          <input id="phonePriceInput" class="form-control" type="number" placeholder="Enter Phone Price" />
          <input id="phoneQtyInput" class="form-control" type="number" placeholder="Enter Phone Qty" />
          <div class="col-12 d-flex justify-content-between">
            <button class="btn btn-primary" onclick="addNewPhone()">Save Phone</button>
            <button class="btn btn-danger" onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>

      <div class="modalBody" id="editPhoneModal">
        <div class="animate__animated animate__fadeInUp bg-white p-4 rounded-3 shadow border d-flex flex-column gap-3">
          <h1>Edit Phone Data</h1>
          <input id="phoneNameInputE" class="form-control" type="text" placeholder="Enter Phone Name" />
          <input id="phonePriceInputE" class="form-control" type="number" placeholder="Enter Phone Price" />
          <input id="phoneQtyInputE" class="form-control" type="number" placeholder="Enter Phone Qty" />
          <div class="col-12 d-flex justify-content-between">
            <button class="btn btn-primary" onclick="updatePhoneData()">Save Phone</button>
            <button class="btn btn-danger" onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./index.js"></script>
  </body>
</html>
